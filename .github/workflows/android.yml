name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Report Spotify OAuth configuration
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID is not configured. The APK can build, but Spotify library authorization will not work until the LUMA app owner configures the Client ID and redirect URI."
          else
            echo "Spotify Client ID is configured."
          fi
      - name: Build debug APK
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
